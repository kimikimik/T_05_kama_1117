<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>毛糸手帖</title>
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/1117.css">
</head>
<body>
<div class="notebook">
<header>
<h1>毛糸手帖</h1>
</header>
<main>
    <input type="text" id="key" placeholder="毛糸名（色番）">
    <textarea id="memo" placeholder="手持ちの数"></textarea>
    <ul>
        <li id="save">手持ちの数を登録する</li>
        <li id="clear">すべての毛糸を削除する</li>
    </ul>
</main>
<table id="list">
<!-- ここに追加データが挿入される -->
</table>
</div>
<script>

//1.Save クリックイベント
$("#save").on("click",function(){
    const key = $("#key").val();
    const value = $("#memo").val();
    localStorage.setItem(key,value);
    // 削除ボタンも行に入れるため、文字列を作るのではなくjQueryで作る
    $("#list").empty();

    for(let i=0; i<localStorage.length; i++){
        // 保存データ1件分を表示する
            // let i = 0：0番目から始める
            // i < localStorage.length：保存件数に達するまで続ける
            // i++：1回ごとに次のデータへ進む
        const savedKey = localStorage.key(i);
        const savedValue = localStorage.getItem(savedKey);
        const row = $("<tr>"); 
            // <tr>=表の新しい1行（th=見出し＝毛糸色番、td=データ＝在庫数）
        const deleteButton = $("<button>").text("使いきった");

        $("<th>").text(savedKey).appendTo(row);
        $("<td>").text(savedValue + "玉").appendTo(row);
        $("<td>").append(deleteButton).appendTo(row);
        $("#list").append(row);

        deleteButton.on("click",function(){
            localStorage.removeItem(savedKey);
            row.remove();
        });
    }
});

//2.clear クリックイベント
$("#clear").on("click",function(){
    localStorage.clear();
    $("#list").empty();
});

//3.ページ読み込み：保存データ取得表示
for(let i=0; i<localStorage.length; i++){
    const key   = localStorage.key(i);
    const value = localStorage.getItem(key);
    const row = $("<tr>");
    const deleteButton = $("<button>").text("使いきった");

    $("<th>").text(key).appendTo(row);
    $("<td>").text(value + "玉").appendTo(row);
    $("<td>").append(deleteButton).appendTo(row);
    $("#list").append(row);

    deleteButton.on("click",function(){
        localStorage.removeItem(key);
        row.remove();
    });
}

</script>
<footer><small>Ami-Tsugi</small></footer>
</body>
</html>
