<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>毛糸手帖</title>
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
</head>
<body>
<header>
<h1>毛糸手帖</h1>
</header>
<main>
    <input type="text" id="key" placeholder="毛糸名（色）">
    <!-- キー入力欄が空のときに「毛糸名（色）」と薄く表示される -->
    <textarea id="memo" placeholder="手持ちの玉数"></textarea>
    <ul>
        <li id="save">手持ちの玉数を保存</li>
        <li id="clear">すべての毛糸を削除する</li>
    </ul>
</main>
<table id="list">
<!-- ここに追加データが挿入される -->
</table>
<script>

function renderList() {
    $("#list").empty();
    // ある毛糸の削除時に表示を作り直すために、表の中身をいったん消す
    for (let i = 0; i < localStorage.length; i++) {
    // i < localStorage.length：保存数より小さい間、繰り返す
    // i++：1回ごとに1増やす
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        const row = $("<tr>");
        const deleteButton = $("<button>")
            .text("この毛糸を削除")
            .addClass("delete")
            .data("key", key);
        $("<th>").text(key).appendTo(row);
        $("<td>").text(value + "玉").appendTo(row);
        $("<td>").append(deleteButton).appendTo(row);
        $("#list").append(row);
    }
}

//1.Save クリックイベント
$("#save").on("click",function(){
    const key = $("#key").val();
    const value = $("#memo").val();
    localStorage.setItem(key,value);
    renderList();
    // 個別削除ボタンを一覧に表示するため、保存後の処理をrenderList()に変更
    // 保存後にrenderList()を呼び出して、LocalStorageのデータから一覧全体を作り直します。これで各行に削除ボタンも表示でき、同じ毛糸名・色で在庫数を更新したときに行が重複するのも防ぐ
});


//2.clear クリックイベント
$("#clear").on("click",function(){
    localStorage.clear();
    $("#list").empty();
});

//3.ページ読み込み：保存データ取得表示
renderList();

</script>
<footer><small>G's</small></footer>
</body>
</html>
